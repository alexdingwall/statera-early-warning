[project]
name = "backend"
version = "0.1.0"
description = "Early Warning backend"
authors = [
    { name = "Alex Dingwall", email = "alex7685g@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "pydantic>=2",
    "python-dateutil>=3.0.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
